cucumber.publish.quiet=true
# Cucumber 8 sin eksperimentelle "glue hint"-advisor kaller Class.getDeclaringClass() på alle
# glue-klasser for å foreslå ytelsesforbedringer. Den krasjer (IncompatibleClassChangeError) på
# syntetiske Kotlin-klasser som oppstår når inline-funksjoner (f.eks. expectOkWithBody) kalles med
# @JvmInline value class-parametere (BehandlingId, VilkårId osv.), siden Kotlins navnemangling gir
# klassenavn med bindestrek. Funksjonen er kun en dev-hint, så den slås av her.
 cucumber.glue.hint.enabled=false