name: Deploy Kafka topics to prod-gcp
on:
  workflow_dispatch:

permissions:
  contents: "read"
  id-token: "write"

jobs:
  deploy-kafka-topic:
    name: Deploy Kafka topics to prod-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: "\
            .nais/topics/statistikk-dvh-behandling/topic-prod.yaml,\
            .nais/topics/utbetaling.v1/topic-prod.yaml"
